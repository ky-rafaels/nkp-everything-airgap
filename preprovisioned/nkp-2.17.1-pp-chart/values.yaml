# Default values for nkp-2.17.1.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# NKP preprovisioned workload cluster configuration (templates/cluster.yaml).
cluster:
  # Cluster name, used to derive the names of every generated resource.
  name: nkp-workload
  # Namespace on the management cluster the CAPI resources are created in.
  namespace: edge-clusters

  network:
    podCIDR: 192.168.0.0/16
    serviceCIDR: 10.96.0.0/12

  # When true, removes the control-plane NoSchedule taint (KubeadmControlPlane
  # init/joinConfiguration nodeRegistration.taints) so workloads can schedule onto the
  # control-plane node(s) - intended for single-node clusters with no separate worker pool.
  singleNode: false

  # The API endpoint (Cluster.spec.controlPlaneEndpoint) clients use to reach the cluster.
  controlPlaneEndpoint:
    host: "192.168.1.47"
    port: 6443

  controlPlane:
    # KubeadmControlPlane replica count for the nkp-workload-3-control-plane control plane.
    replicas: 3
    # PreprovisionedCluster.spec.controlPlaneEndpoint.host - the control-plane node's address
    # kube-vip uses before the virtual IP takes over.
    endpointHost: "192.168.1.48"
    # Interface kube-vip uses to advertise the control-plane virtual IP.
    virtualIPInterface: eno2
    # SSH-reachable hosts backing the control-plane PreprovisionedInventory.
    hosts:
      - address: "192.168.1.48"
      - address: "192.168.1.49"
      - address: "192.168.1.50"

  workers:
    # MachineDeployment replica count for the nkp-workload-3-md-0 worker pool.
    replicas: 4
    # SSH-reachable hosts backing the worker PreprovisionedInventory.
    hosts: 
      - address: "192.168.1.51"
      - address: "192.168.1.52"
      - address: "192.168.1.53"
      - address: "192.168.1.54"

  ssh:
    user: nutanix
    # base64-encoded PEM private key for the ssh-key Secret. Do not commit real key
    # material here - supply via --set-file, -f a secrets values file, or --set.
    privateKeyBase64: ""

  etcd:
    # base64-encoded 32-byte AES-CBC key used in the etcd-encryption-config Secret's
    # EncryptionConfig (secrets/configmaps at rest). Generate with:
    #   head -c 32 /dev/urandom | base64
    # Do not commit real key material here - supply via -f a secrets values file or --set.
    encryptionKey: ""

  # Containerd registry mirror used by the control-plane and md-0 containerd-configuration
  # Secrets (templates/secrets.yaml) to redirect image pulls through an airgapped mirror.
  containerd:
    registryMirror:
      # Bare hostname (no scheme) of the airgapped registry mirror. Used both as the
      # docker.io/catch-all mirror endpoint and as the containerd registry TLS config key.
      host: registry.internal.example.com
      # Path containerd is configured to read the CA cert from on-host (written to this path
      # via the file below - it does not need to pre-exist on the hosts).
      caFile: /etc/containerd/ca-konvoy-mirror.crt
      # Raw PEM contents of the CA cert used to trust the registry mirror above, written to
      # caFile on every control-plane host. Do not commit a real org's CA here - supply via
      # -f a secrets values file or --set-file cluster.containerd.registryMirror.caCert=<path>.
      caCert: |
        -----BEGIN CERTIFICATE-----
        MIIBcDCCARWgAwIBAgIRAP71jOPQISJzrgBZ5bfkPTgwCgYIKoZIzj0EAwIwFzEV
        MBMGA1UEAxMMa29tbWFuZGVyLWNhMB4XDTI2MDMyNDEzNTMwOVoXDTM2MDMyMTEz
        NTMwOVowFzEVMBMGA1UEAxMMa29tbWFuZGVyLWNhMFkwEwYHKoZIzj0CAQYIKoZI
        zj0DAQcDQgAE2srQhzqIYEXuLKuZ+fghBC6mnY3L+MTTXVZOs+pXZFp6P8tY6ftX
        vmXtPhUFl7zjJoliTOPSNHDx3IUz3VsRJaNCMEAwDgYDVR0PAQH/BAQDAgKkMA8G
        A1UdEwEB/wQFMAMBAf8wHQYDVR0OBBYEFJzCQMrNcpHOts3SMpMr+T0vDpkGMAoG
        CCqGSM49BAMCA0kAMEYCIQDL6ifWRJ2IWzj1qGj/SzT2pNBqac2uLv1VbFaR5SqO
        8gIhANVj2uUmlIuRzPOuvel9HQ9osfSOjFpryJF9U89uJYAC
        -----END CERTIFICATE-----

# # MetalLB IPAddressPool/L2Advertisement applied to the workload cluster (templates/metallb.yaml).
metallb:
  namespace: metallb-system
  addressPool:
    name: default
    addresses:
      - 192.168.1.15-192.168.1.18
  l2Advertisement:
    name: default

