apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  labels:
    konvoy.d2iq.io/cluster-name: {{ .Values.cluster.name }}
  name: calico-cni-installation-{{ .Values.cluster.name }}
  namespace: {{ .Values.cluster.namespace }}
spec:
  clusterSelector:
    matchLabels:
      konvoy.d2iq.io/cluster-name: {{ .Values.cluster.name }}
      konvoy.d2iq.io/cni: calico
      konvoy.d2iq.io/provider: preprovisioned
  resources:
  - kind: ConfigMap
    name: tigera-operator-{{ .Values.cluster.name }}
  - kind: ConfigMap
    name: calico-cni-installation-{{ .Values.cluster.name }}
  strategy: Reconcile
---
apiVersion: v1
data:
  custom-resources.yaml: |
    # This section includes base Calico installation configuration.
    # For more information, see: https://docs.projectcalico.org/reference/installation/api
    apiVersion: operator.tigera.io/v1
    kind: Installation
    metadata:
      name: default
    spec:
      # Configures Calico networking.
      calicoNetwork:
        # Note: The ipPools section cannot be modified post-install.
        ipPools:
        - blockSize: 26
          cidr: {{ .Values.cluster.network.podCIDR }}
          encapsulation: IPIP
          natOutgoing: Enabled
          nodeSelector: all()
        bgp: Enabled
        nodeAddressAutodetectionV4:
          kubernetes: NodeInternalIP
      nodeMetricsPort: 9091
      typhaMetricsPort: 9093
      controlPlaneTolerations:
        - key: node.cloudprovider.kubernetes.io/uninitialized
          value: "true"
          effect: NoSchedule
        - key: node.kubernetes.io/not-ready
          effect: NoSchedule
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
          operator: Exists
kind: ConfigMap
metadata:
  name: calico-cni-installation-{{ .Values.cluster.name }}
  namespace: {{ .Values.cluster.namespace }}
