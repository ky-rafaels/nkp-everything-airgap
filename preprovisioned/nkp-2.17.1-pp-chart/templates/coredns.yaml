apiVersion: addons.cluster.x-k8s.io/v1beta1
kind: ClusterResourceSet
metadata:
  labels:
    konvoy.d2iq.io/cluster-name: {{ .Values.cluster.name }}
  name: coredns-{{ .Values.cluster.name }}
  namespace: {{ .Values.cluster.namespace }}
spec:
  clusterSelector:
    matchLabels:
      konvoy.d2iq.io/cluster-name: {{ .Values.cluster.name }}
  resources:
  - kind: ConfigMap
    name: coredns-{{ .Values.cluster.name }}
  strategy: Reconcile
---
apiVersion: v1
data:
  coredns.yaml: |
    apiVersion: v1
    kind: ConfigMap
    metadata:
      name: coredns
      namespace: kube-system
    data:
      Corefile: |
        .:53 {
            errors
            health {
               lameduck 5s
            }
            ready
            kubernetes cluster.local in-addr.arpa ip6.arpa {
               pods insecure
               fallthrough in-addr.arpa ip6.arpa
               ttl 30
            }
            prometheus :9153
            forward . /etc/resolv.conf {
               max_concurrent 1000
            }
            cache 30
            loop
            reload
            loadbalance
        }
kind: ConfigMap
metadata:
  name: coredns-{{ .Values.cluster.name }}
  namespace: {{ .Values.cluster.namespace }}
